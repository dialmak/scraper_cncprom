name: Перебудувати сайт

# Лише вручну, без розкладу: викотити новий код на сайт, не чекаючи ночі.
# Перебудовує мапи й сторінку змін НОВИМ кодом з даних останнього
# опублікованого прогону — пів хвилини замість ~3 год. Без скрапінгу, без
# нового знімка й без коміту в гілку data.
#
# Власних кроків немає: це виклик deploy-pages.yml («Скрапінг та перебудова
# сайту») зі scrape: false, тож збірка й публікація не розходяться між двома
# файлами. Черга теж спільна (concurrency: pages на рівні job у
# deploy-pages.yml) — перебудова не накладеться на нічний прогін, а дочекається
# його кінця.
#
# З терміналу: gh workflow run rebuild-pages.yml
on:
  workflow_dispatch:

# Токен кроків, яких викликають, не може мати більше прав, ніж дав виклик:
# публікація пушить у гілку site.
permissions:
  contents: write

jobs:
  rebuild:
    uses: ./.github/workflows/deploy-pages.yml
    with:
      scrape: false
