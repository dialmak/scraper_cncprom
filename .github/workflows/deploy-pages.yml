name: Скрапінг + деплой мапи на GitHub Pages

# Нічний прогін повного пайплайну (discover-categories → scrape-all-categories →
# build-maps) на ubuntu-latest, публікація output/site/ як Pages-артефакт напряму
# (вміст output/site/ — корінь сайту, тож адреси без /site/: /map.html,
# /<id>_map.html, /reports/index.html; старі /site/… — заглушки-переадресації
# від build-maps.js) — output/ в git не потрапляє.
#
# Після build-maps.js той самий job готує робочу копію гілки `data` через git
# worktree (створює її як orphan при першому запуску), пише туди сьогоднішній
# знімок (generate-snapshot.js) і diff-звіт (diff-map.js), і комітить/пушить
# лише ці два нові файли в `data` — output/ це не зачіпає.
on:
  schedule:
    # cron-хвилина навмисно не кругла (не :00) — на круглих позначках GitHub
    # Actions відомо затримує/пропускає заплановані прогони через перевантаження
    # черги. DST теж не враховується — Києву відповідає інша година взимку.
    - cron: '18 18 * * *'
  workflow_dispatch: # можливість запустити вручну з вкладки Actions
    inputs:
      rebuild_only:
        # Лише перебудувати мапи й сторінку змін НОВИМ кодом з даних останнього
        # опублікованого прогону (fetch-published.js) — ~2 хв замість ~3 год.
        # Без скрапінгу, без нового знімка й без коміту в гілку data.
        description: 'Без скрапінгу: перебудувати сайт з уже опублікованих даних'
        type: boolean
        default: false

permissions:
  contents: write # write — потрібно комітити/пушити знімок+звіт у гілку data
  pages: write
  id-token: write

# Не даємо двом прогонам публікувати одночасно (нічний за розкладом міг
# накластися на ручний запуск через workflow_dispatch).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    # Реальний нічний прогін усіх 23 категорій зараз ~3 год (scrape.log) — лишаємо
    # запас, але нижче платформного ліміту в 360 хв, щоб зависання падало явно,
    # а не мовчки з'їдало весь ліміт.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Встановити Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Встановити Chromium для Playwright
        if: ${{ !inputs.rebuild_only }}
        run: npx playwright install --with-deps chromium

      - name: Адреса GitHub Pages
        id: pages-url
        if: ${{ inputs.rebuild_only }}
        run: echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Етап 1 — знайти категорії 1 рівня
        if: ${{ !inputs.rebuild_only }}
        run: node discover-categories.js

      - name: Етап 2 — відскрапити всі категорії за чергою
        if: ${{ !inputs.rebuild_only }}
        run: node scrape-all-categories.js

      - name: "Без скрапінгу: дані останнього опублікованого прогону"
        if: ${{ inputs.rebuild_only }}
        run: node fetch-published.js "${{ steps.pages-url.outputs.url }}"

      - name: Етап 3 — згенерувати мапи + індекс
        run: node build-maps.js

      - name: "Підготувати робочу копію гілки data"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add data-branch data
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: "Знімок дня + diff-звіт"
        if: ${{ !inputs.rebuild_only }}
        run: |
          node generate-snapshot.js data-branch
          node diff-map.js data-branch

      - name: "Закомітити й запушити гілку data"
        if: ${{ !inputs.rebuild_only }}
        run: |
          cd data-branch
          git add snapshots reports
          git commit -m "Знімок і diff-звіт за $(date -u +%F)" || echo "Немає змін для коміту"
          git push origin data

      - name: "Сторінка змін каталогу (reports/index.html)"
        # Будує output/site/reports/ з УСІХ знімків гілки data: дашборд зі шкалою
        # змін по днях і порівнянням будь-яких двох дат (diff рахується в
        # браузері з компактних знімків — див. build-reports.js). Замінює
        # колишнє копіювання щоденних HTML-звітів diff-map.js; той тепер пише
        # лише Markdown-історію в гілку data. reports/latest.html лишається
        # переадресацією на index.html для старих посилань.
        run: node build-reports.js data-branch

      - name: Підготувати Pages-артефакт
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/site

  deploy:
    needs: scrape-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опублікувати на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
