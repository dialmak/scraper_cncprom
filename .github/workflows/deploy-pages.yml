name: Скрапінг + деплой мапи на GitHub Pages

# Нічний прогін повного пайплайну (scrape-site → build-maps) на ubuntu-latest.
# Готовий output/site/ пушиться одним orphan-комітом у гілку `site`, з якої
# GitHub Pages публікує сайт (Settings → Pages → Deploy from a branch, site /).
# Вміст гілки — корінь сайту, тож адреси без /site/: /map.html, /<id>_map.html,
# /reports/index.html; старі /site/… — заглушки-переадресації від build-maps.js.
# У `main` output/ не потрапляє.
#
# Гілка `site` існує ще й для того, щоб згенеровані сторінки можна було
# переглядати прямо на GitHub — раніше вони жили лише в Pages-артефакті.
#
# Після build-maps.js той самий job готує робочу копію гілки `data` через git
# worktree (створює її як orphan при першому запуску), пише туди сьогоднішній
# знімок (generate-snapshot.js) і комітить/пушить лише його в `data` —
# output/ це не зачіпає.
on:
  schedule:
    # cron-хвилина навмисно не кругла (не :00) — на круглих позначках GitHub
    # Actions відомо затримує/пропускає заплановані прогони через перевантаження
    # черги. DST теж не враховується — Києву відповідає інша година взимку.
    - cron: '18 20 * * *'
  workflow_dispatch: # можливість запустити вручну з вкладки Actions
    inputs:
      rebuild_only:
        # Лише перебудувати мапи й сторінку змін НОВИМ кодом з даних останнього
        # опублікованого прогону (fetch-published.js) — ~2 хв замість ~3 год.
        # Без скрапінгу, без нового знімка й без коміту в гілку data.
        description: 'Без скрапінгу: перебудувати сайт з уже опублікованих даних'
        type: boolean
        default: false

permissions:
  # Пушимо знімок у гілку `data` і готовий сайт у гілку `site`. Прав pages/
  # id-token більше не треба: Pages збирається сама з гілки, а не з артефакту.
  contents: write

# Не даємо двом прогонам публікувати одночасно (нічний за розкладом міг
# накластися на ручний запуск через workflow_dispatch).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    # Реальний нічний прогін усіх 23 категорій зараз ~3 год (scrape.log) — лишаємо
    # запас, але нижче платформного ліміту в 360 хв, щоб зависання падало явно,
    # а не мовчки з'їдало весь ліміт.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Встановити Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Встановити Chromium для Playwright
        if: ${{ !inputs.rebuild_only }}
        run: npx playwright install --with-deps chromium

      - name: Адреса GitHub Pages
        id: pages-url
        run: echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Дата знімка
        if: ${{ !inputs.rebuild_only }}
        # Знімок датується РАНКОМ, якому належить: прогін стартує ввечері і
        # триває ~3 год, тож вечірній старт — це дата наступного дня.
        #
        # Інакше дата залежала б від того, чи встиг прогін перетнути опівніч
        # UTC. З колишнім cron 18:18 (реальний старт ~21:26 через чергу
        # GitHub) він завжди її перетинав; з 20:18 — може і не перетнути, а
        # може й перетнути, залежно від затримки черги. Тоді два сусідні
        # нічні прогони записались би в один і той самий snapshots/<дата>.json,
        # і один з них мовчки зник би — разом з можливістю порівняти дні.
        run: |
          if [ "$(date -u +%H)" -ge 12 ]; then d=$(date -u -d '+1 day' +%F); else d=$(date -u +%F); fi
          echo "SNAPSHOT_DATE=$d" >> "$GITHUB_ENV"
          echo "Знімок цього прогону буде датовано $d"

      - name: "Історія логів з опублікованого сайту"
        if: ${{ !inputs.rebuild_only }}
        # Чекаут свіжий, output/ порожній — без цього кроку scrape.jsonl щоночі
        # починався б з нуля, і таблиця прогонів на сайті мала б одну ніч. Сайт
        # недоступний — не помилка: скрипт лише попередить, скрапінг піде далі.
        run: node fetch-published.js --logs-only "${{ steps.pages-url.outputs.url }}"

      - name: Етап 1 — розвідка категорій + скрапінг усіх за чергою
        if: ${{ !inputs.rebuild_only }}
        run: node scrape-site.js

      - name: "Без скрапінгу: дані останнього опублікованого прогону"
        if: ${{ inputs.rebuild_only }}
        run: node fetch-published.js "${{ steps.pages-url.outputs.url }}"

      - name: Етап 2 — згенерувати мапи + індекс
        # Звідки збірка — для колонки «Збірка» у «Лозі збірки» (map.jsonl).
        env:
          BUILD_KIND: ${{ inputs.rebuild_only && 'rebuild' || (github.event_name == 'schedule' && 'nightly' || 'manual') }}
        run: node build-maps.js

      - name: "Підготувати робочу копію гілки data"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add data-branch data
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: "Знімок дня"
        if: ${{ !inputs.rebuild_only }}
        run: node generate-snapshot.js data-branch

      - name: "Закомітити й запушити гілку data"
        if: ${{ !inputs.rebuild_only }}
        run: |
          cd data-branch
          git add snapshots
          git commit -m "Знімок за ${SNAPSHOT_DATE}" || echo "Немає змін для коміту"
          git push origin data

      - name: "Сторінка змін каталогу (reports/index.html)"
        # Будує output/site/reports/ з УСІХ знімків гілки data: дашборд зі шкалою
        # змін по днях і порівнянням будь-яких двох дат (diff рахується в
        # браузері з компактних знімків — див. build-reports.js).
        # reports/latest.html лишається переадресацією на index.html для
        # старих посилань.
        run: node build-reports.js data-branch

      - name: "Опублікувати сайт у гілку site"
        # Окремий репозиторій просто в output/site: `main` цю теку гітигнорить,
        # тож додати її як звичайні файли з основного checkout не вийде.
        # Щоразу один orphan-коміт із force — гілка лишається одним знімком
        # поточного сайту, історія не накопичується (її роль виконують знімки
        # в гілці `data`).
        #
        # CNAME тут ОБОВ'ЯЗКОВИЙ, на відміну від колишньої публікації через
        # Actions, де GitHub його ігнорував: при збірці з гілки власний домен
        # береться саме з цього файлу, і без нього map.cncprom.pp.ua відвалиться.
        # .nojekyll — щоб Pages не ганяв Jekyll по згенерованих файлах.
        run: |
          cd output/site
          touch .nojekyll
          echo "map.cncprom.pp.ua" > CNAME
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт за $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
