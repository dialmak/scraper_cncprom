name: Скрапінг + деплой мапи на GitHub Pages

# Нічний прогін повного пайплайну (discover-categories → scrape-all-categories →
# build-maps) на ubuntu-latest, публікація output/ як Pages-артефакт напряму —
# output/ в git не потрапляє.
#
# Після build-maps.js той самий job готує робочу копію гілки `data` через git
# worktree (створює її як orphan при першому запуску), пише туди сьогоднішній
# знімок (generate-snapshot.js) і diff-звіт (diff-map.js), і комітить/пушить
# лише ці два нові файли в `data` — output/ це не зачіпає.
on:
  schedule:
    # cron-хвилина навмисно не кругла (не :00) — на круглих позначках GitHub
    # Actions відомо затримує/пропускає заплановані прогони через перевантаження
    # черги. DST теж не враховується — Києву відповідає інша година взимку.
    - cron: '18 18 * * *'
  workflow_dispatch: {} # можливість запустити вручну з вкладки Actions

permissions:
  contents: write # write — потрібно комітити/пушити знімок+звіт у гілку data
  pages: write
  id-token: write

# Не даємо двом прогонам публікувати одночасно (нічний за розкладом міг
# накластися на ручний запуск через workflow_dispatch).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    # Реальний нічний прогін усіх 23 категорій зараз ~3 год (scrape.log) — лишаємо
    # запас, але нижче платформного ліміту в 360 хв, щоб зависання падало явно,
    # а не мовчки з'їдало весь ліміт.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Встановити Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: Встановити Chromium для Playwright
        run: npx playwright install --with-deps chromium

      - name: Етап 1 — знайти категорії 1 рівня
        run: node discover-categories.js

      - name: Етап 2 — відскрапити всі категорії за чергою
        run: node scrape-all-categories.js

      - name: Етап 3 — згенерувати мапи + індекс
        run: node build-maps.js

      - name: "Підготувати робочу копію гілки data"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin data:refs/remotes/origin/data 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add data-branch data
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: "Знімок дня + diff-звіт"
        run: |
          node generate-snapshot.js data-branch
          node diff-map.js data-branch

      - name: "Закомітити й запушити гілку data"
        run: |
          cd data-branch
          git add snapshots reports
          git commit -m "Знімок і diff-звіт за $(date -u +%F)" || echo "Немає змін для коміту"
          git push origin data

      - name: "Скопіювати diff-звіт (HTML) у output/site/reports/ для публікації на Pages"
        # data-branch сама на Pages не публікується (тільки output/); тож
        # HTML-версію diff-звіту (пише diff-map.js поряд із .md) копіюємо в
        # output/site/reports/, звідки її вже підхопить крок нижче. Додатково
        # кладемо копію сьогоднішнього звіту під стабільним ім'ям latest.html —
        # саме на нього веде кнопка "📄 Diff-звіт" у шапці map.html/<id>_map.html
        # (build-maps.js/render-map.js), які самі виконуються РАНІШЕ за
        # diff-map.js в цьому ж прогоні й тому не можуть послатись на файл
        # сьогоднішньої дати напряму.
        run: |
          mkdir -p output/site/reports
          cp data-branch/reports/*.html output/site/reports/ 2>/dev/null || true
          cp "data-branch/reports/$(date -u +%F).html" output/site/reports/latest.html

      - name: Підготувати Pages-артефакт
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    needs: scrape-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Опублікувати на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
