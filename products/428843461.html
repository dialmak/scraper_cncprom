<p>За допомогою Т-подібного <a href="/g59524782-bolty" target="_self">болта</a> можна з'єднувати різні конструкції між собою. Т-болт встановлюються в паз алюмінієвого профілю. Завдяки т-образній формі і квадратному підголовку болт надійно фіксується в посадковому отворі, виключається його провертання.</p>
