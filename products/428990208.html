<p>Сухар пазовий 30-M6 вводиться в паз з торця профілю і дозволяє кріпити до профілю різні додаткові елементи і конструкції, використовуючи б<a href="/g59524782-bolty" target="_self">олти </a>і гвинти з відповідною різьбою. Відмінність пазів сухаря від Т-гайок полягає в їх більшій несучій здатності.</p>
