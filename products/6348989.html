<h2>Кнопка аварійної зупинки E-STOP з двома парами контактів з фіксатором</h2>
<p>В нормальному стані пара контактів №1 перебувати в розімкнутому стані, №2 - замкнутому.</p>
<p>При натисканні: №1 - замкнений стан, №2 - розімкнений стан.</p>
