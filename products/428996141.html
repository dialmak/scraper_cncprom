<p>Сухар пазовий 40-M8 вводиться в паз з торця профілю і дозволяє кріпити до профілю різні додаткові елементи і конструкції, використовуючи б<a href="/g59524782-bolty" target="_self">олти </a>і гвинти з відповідною різьбою. Відмінність пазового сухаря від Т-гайок полягає в їх більшій несучій здатності.</p>
