<p>Гвинт з напівкруглою головкою і внутрішнім шестигранником М6х12 використовуються разом з шайбами і г<a href="/g59525250-gajki" target="_self">айками </a>з відповідними гвинтами розміром і кроком різьблення для кріплення різних деталей і конструкцій. Гвинт має оцинковане покриття і виготовляється з вуглецевої сталі. Клас міцності 10,9.</p>
