<p>Сухар пазовий 20-M4 вводиться в паз з торця профілю і дозволяє кріпити до профілю різні додаткові елементи і конструкції, використовуючи болти і гвинти з відповідною різьбою. Відмінність пазового сухаря від Т-гайок полягає в їх більшій несучій здатності.</p>
