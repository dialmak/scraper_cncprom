<p><span style="font-size:16px">Супер-вантажопідйомні профільні рейкові направляючі серій HG і ЕG. На 30% перевершує аналогічну продукцію по вантажопідйомності і жорсткості завдяки оптимізованому напівкруглому профілю. Оптимізована конструкція циркуляції кульок забезпечує системі плавний хід.</span></p>
