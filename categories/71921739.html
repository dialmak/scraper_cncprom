<span style="font-size:16px">У цій групі представлені системи змащення напрямних і передач. Змащуючий матеріал створює масляну плівку, яка зменшує тертя металу з металом, тим самим запобігаючи швидкий знос комплектуючих. Мастило так само зменшує шум рухомих частин, захищає від вологи і корозії, служить тепловідводом.</span>
